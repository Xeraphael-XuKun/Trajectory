# control: rotation at full strength from step 0
#
#   bash run_hihr.sh whu_rope_full_clip
#
# Derived from hihr_whu_pe_indep_clip.yml.  Keys marked [VARIABLE] below are the
# only ones that differ from it.
#
# THE CONTROL THAT MAKES THE MAIN ARM READABLE, and the one that may explain
# the ViT-base attempt.  Identical to rope_indep_clip except ROPE_GATE is off,
# so the rotation runs at full strength from the first iteration.
#
# CLIP's attention was pretrained with no rotation at all.  Switching it on at
# full strength perturbs every attention map before a single gradient step,
# which is the same failure mode the additive delta avoids by starting at zero
# -- and that zero start is what turned direction one from "noise" into +1.30.
#
# It also separates two outcomes the main arm alone cannot: if alpha ends up
# near zero there, the reading is either "the model does not want rotation" or
# "the gate never let it move".  If this arm is clearly WORSE than baseline
# while the gated one is not, the first reading is wrong and the gate is doing
# real work; if both land nowhere, rotary simply has nothing to offer here.
#
# CONTROLS:  recipe_clip     11.99 / 31.10   no positional increment
#            pe_indep_clip   13.29 / 34.10   additive per-layer delta (+1.30)
#
MODEL:
  PRETRAIN_CHOICE: 'imagenet'

  # [VARIABLE] the deliberate change from the run this re-does: the raw
  # OpenAI release instead of our CARGO checkpoint.
  PRETRAIN_PATH: 'ViT-B-16.pt'
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # [RECIPE] HiHR section 4.4: "cross-entropy loss and triplet loss".
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]
  # [VARIABLE] the only deliberate change from the baseline config
  # [VARIABLE] the rotation REPLACES the additive delta; it does not stack.
  PE_LAYERWISE: 'none'
  # Rotary needs the pretrained position table kept, otherwise "alpha = 0
  # equals the baseline" is false before the first step: dropping the table
  # is itself a change, and a large one on a fine-tuned backbone.
  # [VARIABLE]
  PE_TYPE: 'rope_fixed'
  PE_KEEP_APE: True
  # [VARIABLE] zero-initialised gain on the rotary phase.
  ROPE_GATE: False
  # [VARIABLE]
  ROPE_FREQ_TRAINABLE: False
  # Leave the inherited table trainable: the baseline trains it, and
  # freezing it would make this a two-variable comparison.
  PE_FREEZE_BASE: False

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  # 4.2: "using Adam"
  OPTIMIZER_NAME: 'Adam'
  # 4.2: "We train for 60 epochs"
  MAX_EPOCHS: 60
  # 4.2: "3.5e-4 for randomly initialized modules and 5e-6 for pre-trained
  #       components"  -- BASE_LR is the head, PRETRAINED_LR the CLIP tower.
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # 4.2: "A warm-up strategy with 100 iterations is applied before the cosine
  #       learning rate schedule."
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"
  # The increments start at zero while everything around them is
  # pretrained.  1.0 keeps them on the head's 3.5e-4 clock (they are
  # new modules, not pretrained weights -- see make_optimizer.py).
  PE_DELTA_LR_MULT: 1.0

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_60.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/whu_rope_full_clip'
