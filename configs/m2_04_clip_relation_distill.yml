# M2-4 完整配置：原velocity-only dense C0加固定RGB关系蒸馏。

MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: '/mnt/cache/wanghanzhi/Datasets/ViT-B-16.pt'
  TRANSFORMER_TYPE: 'vit_base_clip'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]
  PE_LAYERWISE: 'none'
  TOKEN_TRAJECTORY: True
  TOKEN_TRAJECTORY_ACCEL_MIX: 0.0
  TOKEN_TRAJECTORY_VARIANT: 'dense'
  PE_FREEZE_BASE: False

  TEXT_ALIGN: False
  VPR: False
  MOD_DELTA: False
  CE_SPLIT_VIEW: False
  CE_SPLIT_MODALITY: False
  SIE_CAMERA: False
  SIE_VIEW: False
  DIST_TRAIN: False
  PE_TYPE: 'learnable'

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: '/mnt/cache/wanghanzhi/Datasets'
  MODALITIES: ['RGB', 'IR', 'Thermal']
  AERIAL_CAMS: [5, 6]
  PROTOCOL: 'ALL'
  SUBDIR: 'WHU-MARS'

DATALOADER:
  SAMPLER: 'PKM'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8
  SYNC_FRAMES: False
  TIE_AUGMENTATION: False

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  SEED: 1234
  CUDNN_BENCHMARK: True
  MAX_EPOCHS: 60
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  IMS_PER_BATCH: 64
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  LOSS_TYPE: 'base'
  PE_DELTA_LR_MULT: 1.0
  TEXT_LOSS_WEIGHT: 0.0
  TWIN_LOSS_WEIGHT: 0.0
  TNCE_WEIGHT: 0.0
  MOD_DELTA_ONLY: False

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_60.pth'
  NECK_FEAT: 'after'
  FEAT_NORM: 'yes'
  METRIC: 'sysu'
  TOP_K_EVAL: 0

OUTPUT_DIR: '/mnt/cache/wanghanzhi/XK/m2-d/logs/student'

M2:
  ENABLED: True
  VARIANT: 'clip_relation_distill'
  CLIP_PATH: '/mnt/cache/wanghanzhi/Datasets/ViT-B-16.pt'
  FEATURE_CACHE: '/mnt/cache/wanghanzhi/XK/m2-d/artifacts/rgb_clip_features.pt'
  RELATION_BANK: '/mnt/cache/wanghanzhi/XK/m2-d/artifacts/clip_identity_relation.pt'
  RGB_CENTERS: '/mnt/cache/wanghanzhi/XK/m2-d/artifacts/rgb_identity_centers.pt'
  TEACHER_TEMPERATURE: 0.07
  STUDENT_TEMPERATURE: 0.07
  RELATION_WEIGHT: 0.2
  RELATION_READOUT: 'after'
  RELATION_REMOVE_SAME_ID: True
  RELATION_ALL_MODAL_PAIRS: True
