# 拆开 CE 的类别：只把热成像分出去（RGB+IR 合成一组）
#
#   bash run_hihr.sh whu_ce_mod_g2
#
# Derived from hihr_whu_ce_mod.yml (10.49 / 34.77).  The controls are that run
# and the unsplit baseline hihr_whu_recipe_hihr.yml (10.23 / 26.68).
#
# THE MEASUREMENT THIS COMES FROM.  whu_ce_mod raised Rank-1 by 8.09 points --
# past the published SOTA of 29.5 -- by giving each spectrum its own class, and
# paid for it with cross-spectrum retrieval.  Section [2b] of
# diag/analyse_modality.py says where that price was paid.  Its "twin" column
# compares the SAME capture at the SAME instant from the SAME camera in two
# spectra, so pose, time and viewpoint are all held fixed and the only
# difference left is the spectrum.  Normalised by the identity budget
# (stranger minus same-spectrum-other-camera), the pure spectrum cost was
#
#                        baseline    whu_ce_mod
#     RGB <-> IR           -16%        +58%
#     RGB <-> Thermal      105%        +113%
#
# RGB and IR were not merely cheap to match, they were FREE: at -16% the same
# capture in the two spectra sat CLOSER than two RGB images of one person from
# one camera.  Cross entropy was supplying that alignment at no cost, and
# splitting them is what made it expensive.  Thermal was already past the whole
# budget before the split and barely moved.
#
# The mAP agrees: of the 17.50 cross-modal points whu_ce_mod lost, 13.57 (78%)
# are the RGB<->IR pair (8.86 -> 2.54 and 10.08 -> 2.83) and 3.93 (22%) are the
# four thermal cells.
#
# SO: keep the split that paid, drop the one that cost.  Thermal keeps its own
# class -- that is where Th->Th 11.61 -> 17.30 came from, itself above UAD's
# published 14.00 -- while RGB and IR go back to sharing one, so CE goes on
# aligning them for free.
#
#     MODALITIES        ['RGB', 'IR', 'Thermal']
#     CE_MODALITY_GROUPS [  0  ,   0 ,     1    ]   -> 500 x 2 = 1000 classes
#
# WHAT IS DELIBERATELY NOT CHANGED.  Everything else is whu_ce_mod verbatim:
# the triplet still keeps the raw pid, the view is not split, AERIAL_CAMS stays
# empty, same schedule, same initialisation.  CE_MODALITY_GROUPS is the single
# key that differs, so the comparison is one factor wide.
#
# THE HONEST RISK.  The result may land between the two controls -- roughly a
# linear interpolation -- which would say the trade is a straight one and there
# is no free lunch in the grouping.  That is a null result, not a bug, and it
# still costs only one run to learn.
#
# WHAT TO READ FIRST, in epoch 1, before any mAP:
#
#     CE split: 500 identities x 2 slots = 1000 classes (view=False,
#               spectra: RGB+IR | Thermal)
#
# If that line says three slots or names the wrong grouping, stop the run.
#
# Then, at the first LOG_PERIOD:
#
#     Epoch[N]  768d d_same=..  d_cross(..)=..  d_diffpid=..
#
# whu_ce_mod reached d_diffpid/d_same 1.384 against the baseline's 1.273.  The
# question this run answers is whether d_cross(RGB,IR) can stay near 1.0 while
# that ratio stays high; whu_ce_mod pushed it to 1.155.
#
# ONE READING TRAP: `Acc` is classification accuracy over 1000 classes, twice
# the baseline's and two thirds of whu_ce_mod's, so it is not comparable with
# either.  It is not degradation.
#
MODEL:
  PRETRAIN_CHOICE: 'self'
  # Overridden on the command line by run_hihr.sh; this is only the default.
  PRETRAIN_PATH: './out_hihr_cargo_base/transformer_60.pth'
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # [RECIPE] HiHR section 4.4: "cross-entropy loss and triplet loss".
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]
  CE_SPLIT_VIEW: False
  CE_SPLIT_MODALITY: True
  # [VARIABLE] the only deliberate change from hihr_whu_ce_mod.yml.
  CE_MODALITY_GROUPS: [0, 0, 1]

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  # 4.2: "using Adam"
  OPTIMIZER_NAME: 'Adam'
  # 4.2: "We train for 60 epochs"
  MAX_EPOCHS: 60
  # 4.2: "3.5e-4 for randomly initialized modules and 5e-6 for pre-trained
  #       components"  -- BASE_LR is the head, PRETRAINED_LR the CLIP tower.
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # 4.2: "A warm-up strategy with 100 iterations is applied before the cosine
  #       learning rate schedule."
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_60.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/whu_ce_mod_g2'
