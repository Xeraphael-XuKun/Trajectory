# whu_ce_mod_g2_clip 跑 90 轮 —— 原生 CLIP 的最优轮数大概率不在 60
#
#   bash run_hihr.sh whu_ce_mod_g2_e90_clip
#
# Derived from hihr_whu_ce_mod_g2_clip.yml.  MAX_EPOCHS is the change; the
# other two keys follow from it -- CHECKPOINT_PERIOD decides whether the last
# epoch is saved at all, and TEST.WEIGHT names the file reeval.sh and
# dump_all.sh look for.
#
# WHY 60 IS PROBABLY NOT THE ANSWER HERE, EVEN THOUGH IT WAS ON THE OTHER
# TOWER.  The epoch sweep on the cargo-initialised backbone came out as a clean
# single peak exactly at 60 -- 11.06 / 11.43 / 11.58 / 11.26 / 10.05 at
# 40 / 50 / 60 / 90 / 120 -- and 60 is what HiHR's section 4.2 specifies.  But
# that backbone had ALREADY had 60 epochs of training on CARGO, so its runs
# were 120 epochs of optimisation in total.  A run from the raw OpenAI tower
# has had 60.
#
# And it shows.  whu_ce_mod_g2_clip's own trajectory is still climbing when it
# stops:
#
#     epoch     10      20      30      40      50      60
#     mAP      7.79   10.75   12.09   12.82   13.06   13.33
#     increment       +2.96   +1.34   +0.73   +0.24   +0.27
#
# The last step is LARGER than the one before it.  That is not the shape of a
# converged run; on the cargo tower the same model went +0.37 then turned over.
#
# (whu_pe_indep_clip is nearer converged -- +0.42 then +0.14 -- so the answer
# may differ per arm.  This one is the arm the paper's claim rests on.)
#
# WHY IT MATTERS BEYOND THIS RUN.  Every raw-CLIP arm was given 60 epochs
# because that is what the cargo-era sweep concluded.  If the optimum moved,
# all of them were stopped early, including the stacking arms -- and the
# comparisons between them stay valid (same budget) while the LEVELS are all
# understated.  Better to know before writing the numbers down.
#
# NOT "the same run, carried on for longer": the schedule is cosine and
# MAX_EPOCHS is its period, so raising it redraws the whole learning-rate
# curve.  Epoch 30 of this run sees a different rate from epoch 30 of the
# 60-epoch one.  Only the final numbers are comparable.
#
# READINGS (control: whu_ce_mod_g2_clip 13.33 / 37.08):
#     > 13.53   the optimum moved right; revisit the budget for every raw-CLIP
#               arm, and re-read whether the 60-epoch levels understate them
#     ~ 13.33   60 was right here too, despite the shorter history
#     < 13.13   already past the peak; the cargo-era conclusion transfers
#
# COST: about 3 hours.
#
MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  # [VARIABLE] the deliberate change: the raw OpenAI release rather than
  # our CARGO checkpoint.  run_hihr.sh points this at $DATA/ViT-B-16.pt,
  # the same file hihr_cargo_base.yml itself starts from.
  PRETRAIN_PATH: 'ViT-B-16.pt'
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # [RECIPE] HiHR section 4.4: "cross-entropy loss and triplet loss".
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]
  CE_SPLIT_VIEW: False
  CE_SPLIT_MODALITY: True
  # [VARIABLE] the only deliberate change from hihr_whu_ce_mod.yml.
  CE_MODALITY_GROUPS: [0, 0, 1]

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  # 4.2: "using Adam"
  OPTIMIZER_NAME: 'Adam'
  # 4.2: "We train for 60 epochs"
  MAX_EPOCHS: 90
  # 4.2: "3.5e-4 for randomly initialized modules and 5e-6 for pre-trained
  #       components"  -- BASE_LR is the head, PRETRAINED_LR the CLIP tower.
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # 4.2: "A warm-up strategy with 100 iterations is applied before the cosine
  #       learning rate schedule."
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 90
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_90.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/whu_ce_mod_g2_e90_clip'
