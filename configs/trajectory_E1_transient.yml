# E1: full-block velocity; remove the same correction after each block.
# Fixed epoch60 / seed1234; post-BN primary, same-checkpoint pre-BN supplement.
MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: 'ViT-B-16.pt'
  TRANSFORMER_TYPE: 'vit_base_clip'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  ID_LOSS_WEIGHT: 1.0
  TRIPLET_LOSS_WEIGHT: 1.0
  CE_SPLIT_VIEW: False
  CE_SPLIT_MODALITY: False
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  DIST_TRAIN: False
  STRIDE_SIZE: [16, 16]
  DROP_PATH: 0.1
  DROP_OUT: 0.0
  ATT_DROP_RATE: 0.0
  SIE_CAMERA: False
  SIE_VIEW: False
  LAYER_SCALE: False
  PE_TYPE: 'learnable'
  PE_LAYERWISE: 'none'
  PE_FREEZE_BASE: False
  TOKEN_TRAJECTORY: True
  TOKEN_TRAJECTORY_VARIANT: 'velocity_transient'
  TOKEN_TRAJECTORY_ACCEL_MIX: 0.0
  TOKEN_TRAJECTORY_EMA_DECAY: 0.25
  TOKEN_TRAJECTORY_HIDDEN_DIM: 16
  TOKEN_TRAJECTORY_RANK: 16
  VPR: False
  MOD_DELTA: False
  TEXT_ALIGN: False
  TEXT_CLIP_PATH: 'ViT-B-16.pt'
  TEXT_N_CTX: 4
  TEXT_MODALITY: 'RGB'
  TEXT_TEMPLATE: 'a photo of a X view person with X X X X .'

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: 'WHU-MARS'
  ROOT_DIR: '/data'
  SUBDIR: ''
  PROTOCOL: 'ALL'
  MODALITIES: ['RGB', 'IR', 'Thermal']
  AERIAL_CAMS: [5, 6]

DATALOADER:
  SAMPLER: 'PKM'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8
  SYNC_FRAMES: False
  TIE_AUGMENTATION: False
  TIE_ERASING: True

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  SEED: 1234
  CUDNN_BENCHMARK: True
  MAX_EPOCHS: 60
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  IMS_PER_BATCH: 64
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  WARMUP_LR_FACTOR: 0.01
  LR_MIN_FACTOR: 0.002
  LARGE_FC_LR: False
  WEIGHT_DECAY: 0.0001
  WEIGHT_DECAY_BIAS: 0.0001
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  LOSS_TYPE: 'base'
  PE_DELTA_LR_MULT: 1.0
  TEXT_LOSS_WEIGHT: 0.0
  TWIN_LOSS_WEIGHT: 0.0
  TNCE_WEIGHT: 0.0
  MOD_DELTA_ONLY: False

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_60.pth'
  NECK_FEAT: 'after'
  FEAT_NORM: 'yes'
  TOP_K_EVAL: 0
  METRIC: 'sysu'

C0_AUX:
  ENABLED: False

TERMINAL_REPAIR:
  ENABLED: False

OUTPUT_DIR: './logs/trajectory_round5_1011/E1_seed1234'
