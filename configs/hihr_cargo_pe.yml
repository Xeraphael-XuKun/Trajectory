# CARGO 上的控制臂：只开位置残差，文本权重 0
#
#   bash run_hihr.sh cargo_pe
#
# Derived from hihr_cargo_pe_text.yml; SOLVER.TEXT_LOSS_WEIGHT is the only key
# that differs.  The text tower is still built and the second delta-free
# forward still runs, so this costs the same as the arm it controls for -- a
# cheaper control that skipped the pass would differ in more than the weight.
#
# WHY IT IS WORTH TWO HOURS.  cargo_pe_text came out at 62.01 / 66.67 against
# cargo_base 62.67 / 68.27, and the view matrix says the loss is not spread
# evenly.  Decomposed by which view the QUERY comes from:
#
#     aerial queries  (A->A + A->G)   130.30 -> 127.62    -2.68
#     ground queries  (G->A + G->G)   133.65 -> 136.26    +2.61
#
# An almost exact zero-sum swap, and it is exactly what the supervision asks
# for: aerial reads as "aerial" before the delta and as "ground" after it, so
# aerial features get pushed onto the ground manifold.  Ground queries retrieve
# better; aerial queries lose their own structure.
#
# (Note this is NOT the diagonal-vs-off-diagonal slide every WHU-MARS knob
# produced.  Split that way, nothing moved: same-view 144.00 -> 144.31,
# cross-view 119.95 -> 119.57.  The effect lives entirely on the query-view
# axis, which is a different decomposition.)
#
# WHAT THIS ARM SEPARATES.  cargo_pe_text bundles the delta and the text loss,
# so the -0.66 could be either.  If this arm lands at or above cargo_base, the
# delta is harmless on CARGO and the whole zero-sum swap belongs to the text
# loss -- which sharpens the claim from "the method needs two entangled axes"
# to "the TEXT CORRECTION needs them".  If it lands below, the delta itself is
# the wrong tool for a single-axis dataset and the text loss is incidental.
#
# CONTROLS:  cargo_base     62.67 / 68.27   neither
#            cargo_pe_text  62.01 / 66.67   both
#
MODEL:
  PRETRAIN_CHOICE: 'imagenet'      # "load a pretrained file", not ImageNet-specific
  PRETRAIN_PATH: 'ViT-B-16.pt'     # sha256 5806e77c... official OpenAI release
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # 4.4: "cross-entropy loss and triplet loss"
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]
  # [VARIABLE] lifted from hihr_whu_text_lam50_clip.yml.
  PE_LAYERWISE: 'indep'
  PE_FREEZE_BASE: False
  TEXT_ALIGN: True
  TEXT_CLIP_PATH: 'ViT-B-16.pt'
  TEXT_TEMPLATE: 'a photo of a X view person with X X X X .'
  TEXT_N_CTX: 4
  TEXT_MODALITY: 'RGB'

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('CARGO')
  ROOT_DIR: ('/data')
  # CARGO is single-modality; this is a placeholder key, not a folder name.
  MODALITIES: ['RGB']
  # Table 4 reports the baseline under ALL.  AA / GG / AG are the other three.
  PROTOCOL: 'ALL'
  # [VARIABLE] CARGO cameras are ONE-based on disk and _camid returns
  # camid-1 under PROTOCOL 'ALL', so drones Cam1..Cam5 are 0..4 here.
  AERIAL_CAMS: [0, 1, 2, 3, 4]

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  PE_DELTA_LR_MULT: 1.0
  # [VARIABLE] the only key that differs from hihr_cargo_pe_text.yml.
  TEXT_LOSS_WEIGHT: 0.0
  # 4.2: "using Adam"
  OPTIMIZER_NAME: 'Adam'
  # 4.2: "We train for 60 epochs"
  MAX_EPOCHS: 60
  # 4.2: "3.5e-4 for randomly initialized modules and 5e-6 for pre-trained
  #       components"  -- BASE_LR is the head, PRETRAINED_LR the CLIP tower.
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # 4.2: "A warm-up strategy with 100 iterations is applied before the cosine
  #       learning rate schedule."
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_60.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  # fast-reid scores CARGO with the Market-1501 junk rule.  The repo default,
  # 'sysu', drops the query's whole camera and reads several points higher --
  # it would not match any number in the paper.
  METRIC: 'market'

OUTPUT_DIR: './logs/cargo_pe'
