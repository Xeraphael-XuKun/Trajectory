# 老师方向一：逐层位置编码残差 —— 独立叠加 (independent)
#
#   bash run_hihr.sh whu_pe_indep
#
# Derived from hihr_whu_recipe_hihr.yml (HiHR's recipe verbatim, mAP 10.23 /
# R-1 26.68), which is the baseline this must be read against.  Exactly one
# key differs: MODEL.PE_LAYERWISE.  Optimiser, learning rates, epochs, warmup,
# loss, backbone, initialisation and evaluation are all untouched.
#
# The baseline injects pos_embed once, before block 0.  This re-injects a
# learned increment before every block while keeping the pretrained table as
# the anchor:
#
#   'indep'  block l CARRIES pos_embed + delta[l] alone      (独立叠加)
#   'chain'  block l CARRIES pos_embed + delta[0..l] summed   (沿初始流转)
#
# Defined by what the residual stream carries, not by what is added there.
# Pre-norm blocks add x back untouched, so every increment persists: adding
# delta[l] at each block accumulates by itself, which is 'chain'.  'indep'
# therefore has to cancel the previous increment (add delta[l] - delta[l-1]).
# Getting this backwards would mislabel the two runs as the advisor's two
# strategies while actually measuring accumulation vs double accumulation.
#
# The increments are zero-initialised, so step 0 reproduces the baseline bit
# for bit and any change is attributable to this module alone.  +1.19M
# parameters (12 x 129 x 768), 1.4% of the backbone.
#
# What this run answers is NOT "how much does it gain".  Per the 2026-08-04
# meeting it is the safety check for direction two: injecting position at
# every layer must not damage the pretrained foundation, because direction
# two needs these increments as its actuator.  Passing means landing within
# noise of 10.23, not beating it.

MODEL:
  PRETRAIN_CHOICE: 'self'
  # Overridden on the command line by run_hihr.sh; this is only the default.
  PRETRAIN_PATH: './out_hihr_cargo_base/transformer_60.pth'
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # [RECIPE] HiHR section 4.4: "cross-entropy loss and triplet loss".
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]
  # [VARIABLE] the only deliberate change from the baseline config
  PE_LAYERWISE: 'indep'
  # Leave the inherited table trainable: the baseline trains it, and
  # freezing it would make this a two-variable comparison.
  PE_FREEZE_BASE: False

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  # 4.2: "using Adam"
  OPTIMIZER_NAME: 'Adam'
  # 4.2: "We train for 60 epochs"
  MAX_EPOCHS: 60
  # 4.2: "3.5e-4 for randomly initialized modules and 5e-6 for pre-trained
  #       components"  -- BASE_LR is the head, PRETRAINED_LR the CLIP tower.
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # 4.2: "A warm-up strategy with 100 iterations is applied before the cosine
  #       learning rate schedule."
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"
  # The increments start at zero while everything around them is
  # pretrained.  1.0 keeps them on the head's 3.5e-4 clock (they are
  # new modules, not pretrained weights -- see make_optimizer.py).
  PE_DELTA_LR_MULT: 1.0

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_60.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/whu_pe_indep'
