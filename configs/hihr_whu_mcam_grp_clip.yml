# 方向二重跑（分组版）：只矫正 TIR，放过 RGB 和 NIR，从原生 CLIP 起步
#
#   bash run_hihr.sh whu_mcam_grp_clip
#
# Derived from hihr_whu_mcam_clip.yml; MODEL.TEXT_MODALITY_TARGETS is the only
# key that differs.
#
#     before (delta off)        after (delta on)
#     RGB      -> "color"       -> "color"        stay put
#     infrared -> "infrared"    -> "infrared"     stay put
#     thermal  -> "thermal"     -> "color"     <- the only cell asking to move
#
# WHY THIS EXISTS RATHER THAN JUST hihr_whu_mcam_clip.yml.  Measured 2026-08-13
# on the cargo-initialised g2 backbone, where the two differ by this key alone
# and share the control arm whu_ce_mod_g2_pe at 11.75:
#
#     whu_ce_mod_g2_mcam       10.69     asks IR to move as well
#     whu_ce_mod_g2_mcam_grp   11.63     leaves IR where it is
#
# Making the text loss drag RGB<->IR together costs 0.94 mAP -- five times the
# +-0.2 this project moves for unattributable reasons.  It is also the second
# independent confirmation of the same principle: section [2b] of the
# diagnostics puts the pure spectrum cost of RGB<->IR at MINUS 16% of the
# identity budget, i.e. the same capture in the two spectra sits CLOSER than
# two RGB images of one person from one camera.  That pair is already aligned;
# every mechanism that has been pointed at it has lost money.  Splitting it in
# the cross entropy cost 78% of whu_ce_mod's cross-modal mAP; aligning it in
# the text loss costs 0.94 here.
#
# WHAT IS NOT PROMISED.  The text loss ITSELF bought nothing even in the
# grouped form: 11.63 against the 11.75 control.  Direction two was closed on
# the cargo tower with the reason "the three spectrum centroids sit at cosine
# 0.9999, and a text anchor is a DIRECTION" -- and whu_ce_mod_g2 had put that
# direction back (centroid distance over d_same, RGB<->IR 0.041 -> 0.190) yet
# mcam died there anyway.  So that diagnosis was at best incomplete.  This run
# is worth its two hours because the raw tower is a third regime again
# (d_same 0.079 against 0.055), not because the mechanism is now expected to
# work.
#
# IF ONLY ONE TEXT ARM IS RUN, RUN THIS ONE, not hihr_whu_mcam_clip.yml.
#
MODEL:
  PRETRAIN_CHOICE: 'imagenet'

  # [VARIABLE] the deliberate change from the run this re-does: the raw
  # OpenAI release instead of our CARGO checkpoint.
  PRETRAIN_PATH: 'ViT-B-16.pt'
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # [RECIPE] HiHR section 4.4: "cross-entropy loss and triplet loss".
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]
  # [VARIABLE] the only deliberate change from the baseline config
  PE_LAYERWISE: 'indep'
  # Leave the inherited table trainable: the baseline trains it, and
  # freezing it would make this a two-variable comparison.
  PE_FREEZE_BASE: False
  # ---- direction two ----
  TEXT_ALIGN: True
  # The ORIGINAL CLIP release, not PRETRAIN_PATH: that points at our
  # CARGO checkpoint, which carries only the image tower.  Overridden
  # to an absolute path by run_hihr.sh.
  TEXT_CLIP_PATH: 'ViT-B-16.pt'
  TEXT_N_CTX: 4
  # [VARIABLE] the axis.  Sends make_model down the 'modality' branch, where
  # the single word slot holds the spectrum instead of the viewpoint and every
  # image in the batch is supervised (192 rows) rather than RGB's 64.
  TEXT_TARGET: 'modality'
  # Load-bearing under this target: it names the spectrum everything is
  # corrected TOWARDS (make_model sets text_target_row from it).  It indexes
  # DATASETS.MODALITIES, so it is the directory name 'RGB' -- the CLIP word for
  # that same spectrum is 'color', one line below.  Different namespaces.
  TEXT_MODALITY: 'RGB'
  # [VARIABLE] the only key that differs from hihr_whu_mcam_clip.yml.
  TEXT_MODALITY_TARGETS: [0, 1, 0]
  # [VARIABLE] three spectrum words in place of aerial/ground.  Learnable
  # vectors: 3 + TEXT_N_CTX = 7, against the view form's 2 + 4 = 6.  Order must
  # match DATASETS.MODALITIES entry for entry -- anchor row m is modality m,
  # and a mismatch would attach the wrong word to a whole spectrum (make_model
  # raises on a length mismatch but cannot see a permutation).
  # Every word must be a SINGLE CLIP token or ViewPrompts raises at startup.
  TEXT_MODALITY_WORDS: ['color', 'infrared', 'thermal']
  # [VARIABLE] 5 placeholders: 1 spectrum slot + TEXT_N_CTX shared ones.  Slots
  # should land at [9, 12, 13, 14, 15] with EOT at 17; ViewPrompts measures them
  # with the vendored tokenizer and raises if the count is wrong, so a miscount
  # fails before any training happens.
  TEXT_TEMPLATE: 'a photo of a person taken by a X camera with X X X X .'

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']
  # c6/c7 zero-based.  Confirmed by geometry: median crops 36x57 and
  # 36x31 against 58-68 x 133-173 on the ground, and c7's aspect ratio
  # of 1.16 (wider than tall) only happens looking near-straight down.
  AERIAL_CAMS: [5, 6]

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  # 4.2: "using Adam"
  OPTIMIZER_NAME: 'Adam'
  # 4.2: "We train for 60 epochs"
  MAX_EPOCHS: 60
  # 4.2: "3.5e-4 for randomly initialized modules and 5e-6 for pre-trained
  #       components"  -- BASE_LR is the head, PRETRAINED_LR the CLIP tower.
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # 4.2: "A warm-up strategy with 100 iterations is applied before the cosine
  #       learning rate schedule."
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"
  # The increments start at zero while everything around them is
  # pretrained.  1.0 keeps them on the head's 3.5e-4 clock (they are
  # new modules, not pretrained weights -- see make_optimizer.py).
  PE_DELTA_LR_MULT: 1.0
  # [VARIABLE] the only key that differs between the three configs.
  # Two-class cross entropy (~0.69 at chance) against an identity loss
  # over hundreds of classes (~6.2 at init, ~4.7 by epoch 2), so this
  # is roughly 42% of the total.
  TEXT_LOSS_WEIGHT: 5.0

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_60.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/whu_mcam_grp_clip'
