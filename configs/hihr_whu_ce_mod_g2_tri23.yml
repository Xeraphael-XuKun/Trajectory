# whu_ce_mod_g2 的三元组权重细扫：2.3
#
#   bash run_hihr.sh whu_ce_mod_g2_tri23
#
# Derived from hihr_whu_ce_mod_g2.yml; MODEL.TRIPLET_LOSS_WEIGHT is the only
# key that differs.
#
# WHAT THIS IS SAMPLING, AND THE HONEST EXPECTATION.  The coarse grid put the
# peak at 2.0 and the interval this sits in is nearly flat: 11.74 at 2.0
# against 11.70 at 3.0, a span of 0.04.  A point drawn inside it lands inside
# it.  The lambda sweep moved +-0.2 for no attributable reason, so a reading
# anywhere in 11.70-11.74 cannot be separated from that.  This is recorded here
# rather than discovered afterwards: the run was requested to confirm the
# shape, and confirming a flat top is a legitimate use of two hours, but it
# will not produce a number to report.
#
# WHAT WOULD ACTUALLY BE INFORMATIVE, if it happens: the mechanism variables
# are NOT flat across this interval and they are what to read.  Cross-thermal
# goes 4.51 -> 4.82 and Th->Th goes 16.41 -> 16.02 between weights 2 and 3, both
# monotone, so this run should land between those.  If it does not -- if the
# 3x3 jumps outside the bracket its neighbours set -- then something other than
# the weight is moving and the whole sweep needs re-reading.
#
# d_diffpid has never fallen on this axis (1.665, 1.702, 1.730, 1.744 at
# weights 1 to 4), so the wash-out failure mode is not expected here either.
#
# COST: about 2 hours.
#
# THE SWEEP SO FAR (training-log numbers, final epoch of each run):
#
#     epochs        40?     50?    60   11.58    90   11.26   120   10.05
#     triplet  1.0 11.58   2.0 11.74   3.0 11.70   4.0 11.58
#     erasing  0.5 11.58   0.7 11.60   (null)
#
#     whu_recipe_hihr, the unsplit control:  10.23 / 26.68
#
MODEL:
  PRETRAIN_CHOICE: 'self'
  # Overridden on the command line by run_hihr.sh; this is only the default.
  PRETRAIN_PATH: './out_hihr_cargo_base/transformer_60.pth'
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # [RECIPE] HiHR section 4.4: "cross-entropy loss and triplet loss".
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]
  CE_SPLIT_VIEW: False
  CE_SPLIT_MODALITY: True
  # [VARIABLE] the only deliberate change from hihr_whu_ce_mod.yml.
  CE_MODALITY_GROUPS: [0, 0, 1]
  # [VARIABLE] the only deliberate change from hihr_whu_ce_mod_g2.yml.
  TRIPLET_LOSS_WEIGHT: 2.3

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  # 4.2: "using Adam"
  OPTIMIZER_NAME: 'Adam'
  # 4.2: "We train for 60 epochs"
  MAX_EPOCHS: 60
  # 4.2: "3.5e-4 for randomly initialized modules and 5e-6 for pre-trained
  #       components"  -- BASE_LR is the head, PRETRAINED_LR the CLIP tower.
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # 4.2: "A warm-up strategy with 100 iterations is applied before the cosine
  #       learning rate schedule."
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_60.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/whu_ce_mod_g2_tri23'
