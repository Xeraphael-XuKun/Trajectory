# 三光谱全拆（原生 CLIP）—— 分组方式的选择依据要重测
#
#   bash run_hihr.sh whu_ce_mod_clip
#
# Derived from hihr_whu_ce_mod_g2_clip.yml by DELETING MODEL.CE_MODALITY_GROUPS,
# which returns the split to one class per spectrum -- 500 x 3 = 1500 classes,
# the form whu_ce_mod ran.
#
# WHY THIS IS NOT SETTLED.  "Merge RGB and IR, split Thermal off" was chosen
# from a measurement taken on the cargo tower: section [2b] of the diagnostics
# put the pure spectrum cost of RGB<->IR at MINUS 16% of the identity budget
# there, and the three-way split lost 78% of its cross-modal mAP on that pair.
# The comparison that followed was also cargo-era:
#
#     whu_ce_mod      10.49 / 34.77     three-way
#     whu_ce_mod_g2   11.58 / 32.71     RGB+IR merged      +1.09
#
# The raw tower's geometry is not the same one those numbers came from --
# d_same 0.167 against 0.055, d_cross(RGB,Th) 1.059 against 1.253 -- and this
# project has already been burnt once by carrying a cargo-era magnitude over:
# the positional delta was closed as noise at +0.13 and is worth +1.30 here.
#
# READINGS (control: whu_ce_mod_g2_clip 13.33 / 37.08):
#     < 13.13   the grouping choice transfers; the [2b] argument holds on both
#               towers and the paper can cite it
#     ~ 13.33   the two forms are equivalent here, and the grouping is a
#               simplification rather than a gain -- still worth having, but
#               the +1.09 cannot be claimed on this tower
#     > 13.53   the choice was wrong here; RGB+IR wanted separating after all,
#               which would also put the [2b] measurement itself in question
#
# The 3x3 says which: on the cargo tower the three-way split cost RGB<->IR
# 15.77 -> 13.12 while lifting Th->Th 11.61 -> 17.30.  If the same trade shows
# up here the mechanism is the same and only the balance moved.
#
# COST: about 2 hours.
#
MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  # [VARIABLE] the deliberate change: the raw OpenAI release rather than
  # our CARGO checkpoint.  run_hihr.sh points this at $DATA/ViT-B-16.pt,
  # the same file hihr_cargo_base.yml itself starts from.
  PRETRAIN_PATH: 'ViT-B-16.pt'
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # [RECIPE] HiHR section 4.4: "cross-entropy loss and triplet loss".
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]
  CE_SPLIT_VIEW: False
  CE_SPLIT_MODALITY: True

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  # 4.2: "using Adam"
  OPTIMIZER_NAME: 'Adam'
  # 4.2: "We train for 60 epochs"
  MAX_EPOCHS: 60
  # 4.2: "3.5e-4 for randomly initialized modules and 5e-6 for pre-trained
  #       components"  -- BASE_LR is the head, PRETRAINED_LR the CLIP tower.
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # 4.2: "A warm-up strategy with 100 iterations is applied before the cosine
  #       learning rate schedule."
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_60.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/whu_ce_mod_clip'
