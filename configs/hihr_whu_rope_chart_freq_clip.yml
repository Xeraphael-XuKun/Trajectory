# TPCG per-image coordinates AND trainable frequencies -- the 2x2 corner
#
#   bash run_hihr.sh whu_rope_chart_freq_clip
#
# Derived from hihr_whu_rope_chart_clip.yml; ROPE_FREQ_TRAINABLE is the only key
# that differs.  With this arm the four rotary runs form a clean 2x2 and the
# interaction can be read the same way the initialisation 2x2 was read (where it
# came out at -0.01, i.e. exactly additive):
#
#                    frequencies fixed      frequencies trainable
#     fixed grid     rope_indep_clip        rope_freq_clip
#     TPCG chart     rope_chart_clip        rope_chart_freq_clip
#
# WHAT EACH AXIS IS.  A frequency is the scale at which a channel pair reads
# distance; leaving them at RoPE-ViT's mixed 2D draw assumes that draw suits a
# 16x8 person crop, which nobody has checked.  The chart is where the
# coordinates come from: one shared centered grid, or a per-image continuous,
# monotonic, fold-free map predicted by TPCG.
#
# THREE ZERO-INITIALISED THINGS IN SERIES.  TPCG starts at the identity chart,
# alpha starts at zero, and the frequencies start at the fixed draw.  So this
# arm is still bit-identical to the CLIP baseline at step 0 -- but nothing in it
# has a reason to move first, which is a real failure mode rather than a
# hypothetical one.  If it lands at the baseline, read the alphas before
# concluding anything: alpha ~ 0 means the model declined the rotation, while a
# grown alpha with no gain means the rotation was used and did not help.
#
# CONTROLS:  recipe_clip           11.99 / 31.10   no positional increment
#            pe_indep_clip         13.29 / 34.10   additive per-layer delta
#            rope_chart_clip       ?               same chart, fixed frequencies
#            rope_freq_clip        ?               same frequencies, fixed grid
#
MODEL:
  PRETRAIN_CHOICE: 'imagenet'

  # [VARIABLE] the deliberate change from the run this re-does: the raw
  # OpenAI release instead of our CARGO checkpoint.
  PRETRAIN_PATH: 'ViT-B-16.pt'
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # [RECIPE] HiHR section 4.4: "cross-entropy loss and triplet loss".
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]
  # [VARIABLE] the only deliberate change from the baseline config
  # [VARIABLE] the rotation REPLACES the additive delta; it does not stack.
  PE_LAYERWISE: 'none'
  # Rotary needs the pretrained position table kept, otherwise "alpha = 0
  # equals the baseline" is false before the first step: dropping the table
  # is itself a change, and a large one on a fine-tuned backbone.
  # [VARIABLE]
  PE_TYPE: 'chartpe'
  PE_KEEP_APE: True
  # [VARIABLE] zero-initialised gain on the rotary phase.
  ROPE_GATE: True
  # [VARIABLE]
  ROPE_FREQ_TRAINABLE: True
  # Leave the inherited table trainable: the baseline trains it, and
  # freezing it would make this a two-variable comparison.
  PE_FREEZE_BASE: False

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  # 4.2: "using Adam"
  OPTIMIZER_NAME: 'Adam'
  # 4.2: "We train for 60 epochs"
  MAX_EPOCHS: 60
  # 4.2: "3.5e-4 for randomly initialized modules and 5e-6 for pre-trained
  #       components"  -- BASE_LR is the head, PRETRAINED_LR the CLIP tower.
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # 4.2: "A warm-up strategy with 100 iterations is applied before the cosine
  #       learning rate schedule."
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"
  # The increments start at zero while everything around them is
  # pretrained.  1.0 keeps them on the head's 3.5e-4 clock (they are
  # new modules, not pretrained weights -- see make_optimizer.py).
  PE_DELTA_LR_MULT: 1.0

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_60.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/whu_rope_chart_freq_clip'
