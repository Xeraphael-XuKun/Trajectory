# 同帧配对采样 —— HiHR 配方不变，只把三模态的正样本对换成同一次拍摄
#
#   bash run_hihr.sh whu_sync
#
# Derived from hihr_whu_recipe_hihr.yml (mAP 10.23 / R-1 26.68).  Exactly one
# key differs: DATALOADER.SYNC_FRAMES.  No new loss, no new module, no new
# parameter -- the sampler already implements this and has six unit tests
# (tests/test_sync_sampler.py); it has simply never been switched on.
#
# What it tests, and why it is worth a run before writing any alignment loss.
#
# The triplet loss already pulls same-identity cross-modality pairs together:
# the batch is 192 rows, `target_rep = target.repeat(3)`, and rows i / i+64 /
# i+128 are the same person in RGB / IR / Thermal.  Hardest-positive mining
# means the cross-thermal positive is usually the one selected.  So "make the
# same identity close across spectra" is not a new idea here -- it is what
# produced the numbers we already have (d_cross(RGB,Thermal) = 1.125 against
# d_diffpid = 1.273 on the test set).
#
# What is *not* in the baseline is that those three rows come from the same
# capture.  By default each modality is sampled independently, so the pair the
# triplet is asked to pull together differs in
#
#     spectrum + pose + time + viewpoint
#
# all at once, and the gradient cannot tell which of the four to remove.  With
# SYNC_FRAMES the three rows are the same person, same camera, same frame --
# the only remaining difference is
#
#     spectrum
#
# so the same triplet loss now points purely at the modality gap.  WHU-MARS
# supports this exactly: stripping the `_m{k}_` field from the filenames, the
# three modality directories of `train` hold the identical set of 30,711 names,
# i.e. every capture is complete and none is dropped.
#
# Readings:
#   * mAP against 10.23 / 26.68.  A rise means cleaner cross-spectral positives
#     are worth something and an explicit pairwise loss is worth building.  No
#     movement means the triplet has already extracted everything this signal
#     carries, and the whole premise of a paired alignment loss is dead -- which
#     is worth 1.5 hours to learn before writing one.
#   * the 3x3 modality matrix, especially the four cross-thermal cells (4.62 /
#     4.39 / 5.03 / 4.34 in the baseline).  Those are the cells the change is
#     aimed at; a rise there with the diagonal held is the shape we want.
#   * the diagonal (RGB->RGB 25.03) must NOT fall.  Pulling the spectra together
#     removes modality-specific detail, and same-modality retrieval depends on
#     it.  If the diagonal drops while the cross cells rise, the gain is a
#     transfer, not a gain.
#
# One line in the sampler's own log confirms it took effect:
#   PKM sampler: frame-synchronised, 30711 complete captures over 500 identities

MODEL:
  PRETRAIN_CHOICE: 'self'
  # Overridden on the command line by run_hihr.sh; this is only the default.
  PRETRAIN_PATH: './out_hihr_cargo_base/transformer_60.pth'
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # [RECIPE] HiHR section 4.4: "cross-entropy loss and triplet loss".
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']
  # Training-neutral: the camera is only read by the evaluator's A/G view
  # matrix.  Set so this run prints the same readout as the direction-two runs
  # and stays comparable with them without a separate reeval.
  AERIAL_CAMS: [5, 6]

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8
  # [VARIABLE] the only deliberate change from hihr_whu_recipe_hihr.yml.
  SYNC_FRAMES: True

SOLVER:
  # 4.2: "using Adam"
  OPTIMIZER_NAME: 'Adam'
  # 4.2: "We train for 60 epochs"
  MAX_EPOCHS: 60
  # 4.2: "3.5e-4 for randomly initialized modules and 5e-6 for pre-trained
  #       components"  -- BASE_LR is the head, PRETRAINED_LR the CLIP tower.
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # 4.2: "A warm-up strategy with 100 iterations is applied before the cosine
  #       learning rate schedule."
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_60.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/whu_sync'
