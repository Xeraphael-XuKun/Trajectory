# Leg 2 at 120 epochs -- is 60 enough?
#
#   bash run_hihr.sh whu_from_cargo_120
#
# Identical to hihr_whu_from_cargo.yml except MAX_EPOCHS (and the two values
# that mechanically follow it: CHECKPOINT_PERIOD and TEST.WEIGHT).
#
# Motivation: the 60-epoch run's mAP gained +0.41 over its last ten epochs,
# the same size as its mid-training decades (+0.47 at 30->40).  A schedule
# that had converged would add much less at the end.  But cosine's final
# low-lr anneal often gives a bump regardless, so the curve alone cannot
# separate "undertrained" from "normal", and this run does.
#
# Note this is NOT "the 60-epoch run plus 60 more": the cosine decay stretches
# over twice the span, so the whole learning-rate trajectory differs.  That is
# inherent to changing the epoch count, not a flaw in the comparison.
#
# Leg 2 at 60 epochs: mAP 10.02 / R-1 25.32.
#
#   run_hihr.sh cargo_base  ->  out_hihr_cargo_base/transformer_60.pth
#   run_hihr.sh whu_from_cargo   (this file)  <- starts from that checkpoint
#
# PRETRAIN_CHOICE 'self' means "a checkpoint from this codebase": keys are
# prefixed `base.`, and the classifier is skipped because CARGO and WHU-MARS
# have different identity counts.  Pointing 'imagenet' at the same file would
# match nothing and train from scratch without complaining, so the two paths
# are now distinct and both are checked at load time.
#
#   Yang & Zhang, "HiHR: Hierarchical Hyperbolic Representation for
#   Aerial-Ground Person Re-Identification", ECCV 2026 (arXiv:2607.09186v1).
#
# Section 4.4 defines the baseline as: "the cross-entropy loss and triplet loss
# to train the baseline model, which is based on the ViT-B/16 from CLIP".
# Everything else comes from section 4.2, quoted per line below.
#
# What the paper does NOT state, and where our value comes from:
#   * weight decay          -- not given; kept at the repo's 1e-4
#   * cosine floor          -- not given; 0.002 of each group's peak (repo default)
#   * label smoothing       -- not mentioned, so plain cross-entropy (off)
#   * padding before crop   -- "random cropping" only; kept at the repo's 10
# These four are the honest gaps in the reproduction. Everything else is pinned.

MODEL:
  PRETRAIN_CHOICE: 'self'
  # Overridden on the command line by run_hihr.sh; this is only the default.
  PRETRAIN_PATH: './out_hihr_cargo_base/transformer_60.pth'
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # WHU-MARS is three-modality: 8 of any anchor's 11 in-batch positives are
  # cross-spectral, and plain batch-hard mining uses only the furthest one,
  # which here is almost always the thermal image.  WRT softmax-weights all
  # of them instead, which is why the WHU-MARS baseline uses it.  Change this
  # one line to 'triplet' to follow HiHR verbatim.
  METRIC_LOSS_TYPE: 'wrt'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  # 4.2: "using Adam"
  OPTIMIZER_NAME: 'Adam'
  # [VARIABLE] the only deliberate change from hihr_whu_from_cargo.yml
  MAX_EPOCHS: 120
  # 4.2: "3.5e-4 for randomly initialized modules and 5e-6 for pre-trained
  #       components"  -- BASE_LR is the head, PRETRAINED_LR the CLIP tower.
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # 4.2: "A warm-up strategy with 100 iterations is applied before the cosine
  #       learning rate schedule."
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 120
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_120.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/whu_from_cargo_120'
