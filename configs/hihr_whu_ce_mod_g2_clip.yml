# whu_ce_mod_g2，但直接从原始 CLIP 起步（不经过 CARGO 那一腿）
#
#   bash run_hihr.sh whu_ce_mod_g2_clip
#
# Derived from hihr_whu_ce_mod_g2.yml.  MODEL.PRETRAIN_CHOICE and
# MODEL.PRETRAIN_PATH are the only keys that differ.
#
# WHAT IS BEING TESTED, AND WHY IT MATTERS MORE THAN IT LOOKS.  Every WHU-MARS
# run in this project -- all of them, without exception -- initialises from
# out_hihr_cargo_base/transformer_60.pth, our reproduction of HiHR's baseline
# row on CARGO (62.67 / 68.27 against the paper's 63.61 / 68.23).  The two-leg
# structure was OUR design, not something the paper prescribes: CARGO and
# WHU-MARS are different datasets.  So the premise "the CARGO leg helps" is an
# assumption sitting underneath every number, and it has never been measured.
#
#     ≈ 11.58   the CARGO leg does nothing.  The paper loses a whole section:
#               no HiHR reproduction to explain, no second dataset to justify,
#               one fewer thing a reviewer can ask about.
#     much lower  the CARGO leg is real and belongs in the method, with a
#               number attached instead of an assumption.
#
# WHAT ELSE CHANGES, NAMED SO IT IS NOT A SURPRISE.  PRETRAIN_CHOICE 'self'
# loads `bottleneck.*` as well as `base.*` (make_model.py:294, deliberately
# last so the heads exist by then); 'imagenet' takes the backbone only
# (make_model.py:125).  So this run also starts with a FRESH BNNeck.  That is
# not a confound to be removed -- it is inherent to not having a first leg,
# since there is no bottleneck to inherit -- but it is part of what the number
# will be measuring.
#
# THE HONEST CONFOUND.  The cargo path has seen 60 epochs on CARGO plus 60 on
# WHU; this one has seen 60 in total.  A lower result could mean "CARGO's data
# helped" or just "more optimisation helped".  Partial mitigation: the epoch
# sweep on this backbone found 90 and 120 epochs to be WORSE than 60 (11.26 and
# 10.05 against 11.58), so more training ON WHU is not what is missing.  That
# is not the same as more training on another dataset.  If this arm lands
# clearly below 11.58, a 90-epoch version of it would separate the two.
#
# CONTROLS (training-log numbers, epoch 60):
#     whu_recipe_hihr    10.23 / 26.68     unsplit CE, from cargo_base
#     whu_ce_mod_g2      11.58 / 32.71     this run's only difference is the init
#
MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  # [VARIABLE] the deliberate change: the raw OpenAI release rather than
  # our CARGO checkpoint.  run_hihr.sh points this at $DATA/ViT-B-16.pt,
  # the same file hihr_cargo_base.yml itself starts from.
  PRETRAIN_PATH: 'ViT-B-16.pt'
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # [RECIPE] HiHR section 4.4: "cross-entropy loss and triplet loss".
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]
  CE_SPLIT_VIEW: False
  CE_SPLIT_MODALITY: True
  # [VARIABLE] the only deliberate change from hihr_whu_ce_mod.yml.
  CE_MODALITY_GROUPS: [0, 0, 1]

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  # 4.2: "using Adam"
  OPTIMIZER_NAME: 'Adam'
  # 4.2: "We train for 60 epochs"
  MAX_EPOCHS: 60
  # 4.2: "3.5e-4 for randomly initialized modules and 5e-6 for pre-trained
  #       components"  -- BASE_LR is the head, PRETRAINED_LR the CLIP tower.
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # 4.2: "A warm-up strategy with 100 iterations is applied before the cosine
  #       learning rate schedule."
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_60.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/whu_ce_mod_g2_clip'
