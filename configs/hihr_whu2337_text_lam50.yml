# the main method: positional delta + viewpoint text, 2 anchors, on WHU-MARS-2337
#
#   bash run_hihr.sh whu2337_text_lam50
#
# Derived from hihr_whu_text_lam50_clip.yml; DATASETS.SUBDIR and OUTPUT_DIR are the only keys
# that differ.  The identity count changes 500 -> 1,000, so the classifier is a
# different width and NO existing checkpoint can be evaluated here -- this arm
# has to be trained, unlike the GD column which is a re-evaluation.
#
# An epoch is 2.3x longer than on WHU-MARS-1000 (~6 h for 60 epochs).  The epoch
# budget stays at 60: the three-point check on the 1,000 split came out +0.03 /
# +0.08 / -0.94 at 90, i.e. 60 is right and the main method is actively worse
# with a longer schedule.
#
# CONTROL:  WHU-MARS-1000: 14.11 / 36.14
#
# PUBLISHED NUMBERS ON THIS SPLIT (paper Table 3, WHU-MARS-2337 column):
#     BoT 4.6/14.8   AGW 5.2/16.9   MSINet 2.6/14.8   TransReID 5.5/13.1
#     TransReID-SSL 9.2/24.4        DC-Former 4.3/10.9   CLIP-ReID 9.3/24.1
#     PHA 5.5/12.0   VDT 6.3/20.0   DTST 7.5/23.5   SeCap 8.0/21.4
#     UAD (CVPR26) 9.6 / 25.7 / 40.9 / 48.2   <- the number to beat
#
# Every one of them is LOWER than the same method's WHU-MARS-1000 score, so do
# not read a drop from 14.11 as a failure: the split is harder (1,337 test
# identities against 500, and a gallery to match).
MODEL:
  PRETRAIN_CHOICE: 'imagenet'

  # [VARIABLE] the deliberate change from the run this re-does: the raw
  # OpenAI release instead of our CARGO checkpoint.
  PRETRAIN_PATH: 'ViT-B-16.pt'
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # [RECIPE] HiHR section 4.4: "cross-entropy loss and triplet loss".
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]
  # [VARIABLE] the only deliberate change from the baseline config
  PE_LAYERWISE: 'indep'
  # Leave the inherited table trainable: the baseline trains it, and
  # freezing it would make this a two-variable comparison.
  PE_FREEZE_BASE: False
  # ---- direction two ----
  TEXT_ALIGN: True
  # The ORIGINAL CLIP release, not PRETRAIN_PATH: that points at our
  # CARGO checkpoint, which carries only the image tower.  Overridden
  # to an absolute path by run_hihr.sh.
  TEXT_CLIP_PATH: 'ViT-B-16.pt'
  TEXT_N_CTX: 4
  # CLIP has never seen infrared or thermal; asking its frozen text
  # tower whether such a crop reads as a ground viewpoint has no
  # grounding.  The correction it learns is positional, and geometry
  # is modality-independent, so it still applies to all three.
  TEXT_MODALITY: 'RGB'
  TEXT_TEMPLATE: 'a photo of a X view person with X X X X .'

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']
  # [VARIABLE] the larger split: 1,000 train identities + 1,337 test, 434,620
  # images in train+test.  Verified on disk 2026-08-17: train is complete in all
  # three spectra, 8 of the 1,337 test identities carry no Thermal (the metric
  # skips a query with no true match, which is the market-1501 convention every
  # published number here uses), and the three spectra hold UNEQUAL counts --
  # 77,253 / 76,975 / 63,276 in train.  That last one is safe because
  # DATALOADER.SYNC_FRAMES is off and PKMSampler draws each spectrum
  # independently per identity; turning SYNC_FRAMES on here would silently drop
  # every capture that is missing one.
  SUBDIR: 'WHU-MARS-2337'
  # c6/c7 zero-based.  Confirmed by geometry: median crops 36x57 and
  # 36x31 against 58-68 x 133-173 on the ground, and c7's aspect ratio
  # of 1.16 (wider than tall) only happens looking near-straight down.
  AERIAL_CAMS: [5, 6]

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  # 4.2: "using Adam"
  OPTIMIZER_NAME: 'Adam'
  # 4.2: "We train for 60 epochs"
  MAX_EPOCHS: 60
  # 4.2: "3.5e-4 for randomly initialized modules and 5e-6 for pre-trained
  #       components"  -- BASE_LR is the head, PRETRAINED_LR the CLIP tower.
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # 4.2: "A warm-up strategy with 100 iterations is applied before the cosine
  #       learning rate schedule."
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"
  # The increments start at zero while everything around them is
  # pretrained.  1.0 keeps them on the head's 3.5e-4 clock (they are
  # new modules, not pretrained weights -- see make_optimizer.py).
  PE_DELTA_LR_MULT: 1.0
  # [VARIABLE] the only key that differs between the three configs.
  # Two-class cross entropy (~0.69 at chance) against an identity loss
  # over hundreds of classes (~6.2 at init, ~4.7 by epoch 2), so this
  # is roughly 42% of the total.
  TEXT_LOSS_WEIGHT: 5.0

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_60.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/whu2337_text_lam50'
