# WHU-MARS from the CARGO checkpoint -- recipe comparison, arm B: WHU-MARS verbatim.
#
#   bash run_hihr.sh whu_recipe_mars
#
# Held constant across both arms, because changing them would compare something
# other than the recipe:
#   * data           WHU-MARS, three modalities, PKM 16 ids x 3 x 4 = 192 imgs
#   * backbone       CLIP-ViT-B/16
#   * initialisation the CARGO checkpoint from leg 1
#   * input norm     CLIP's own mean/std.  This is a property of the *weights*,
#                    not of the recipe: both arms start from a checkpoint fitted
#                    to that distribution, so feeding one arm 0.5/0.5 would be a
#                    confound rather than a recipe difference.
#   * evaluation     sysu junk rule, last-epoch reporting
#
# The seven things that do differ are all below, marked [RECIPE].

MODEL:
  PRETRAIN_CHOICE: 'self'
  # Overridden on the command line by run_hihr.sh; this is only the default.
  PRETRAIN_PATH: './out_hihr_cargo_base/transformer_60.pth'
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # [RECIPE] the UAD baseline's weighted regularised triplet.
  METRIC_LOSS_TYPE: 'wrt'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  # [RECIPE] SGD with momentum 0.9 (the defaults.py value the UAD baseline uses)
  OPTIMIZER_NAME: 'SGD'
  # [RECIPE]
  MAX_EPOCHS: 120
  # [RECIPE] one rate for everything -- no split between the pretrained tower
  # and the fresh head.  PRETRAINED_LR 0.0 disables the split.  This is the
  # single riskiest difference: 0.008 uniformly on CLIP weights is 1600x what
  # HiHR gives them, and if this arm collapses that IS the result, not a bug.
  BASE_LR: 0.008
  PRETRAINED_LR: 0.0
  BIAS_LR_FACTOR: 2
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # [RECIPE] 5 epochs = 2345 iterations here, 23x HiHR's warmup.
  # WARMUP_ITERS 0 switches the scheduler back to counting epochs.
  WARMUP_ITERS: 0
  WARMUP_EPOCHS: 5
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 120
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_120.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/whu_recipe_mars'
