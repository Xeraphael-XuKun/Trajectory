# whu_ce_mod_g2 的轮数扫描（向下）：50 轮
#
#   bash run_hihr.sh whu_ce_mod_g2_e50
#
# Derived from hihr_whu_ce_mod_g2.yml.  MAX_EPOCHS is the change; the other two
# keys follow from it -- CHECKPOINT_PERIOD decides whether the last epoch is
# saved at all, and TEST.WEIGHT names the file reeval.sh and dump_all.sh look
# for.
#
# WHY DOWNWARDS.  The first pass went up and every step made it worse: 11.58 at
# 60 epochs, 11.26 at 90, 10.05 at 120 -- below the unsplit baseline.  So the
# optimum is not above 60, and the geometry says what is happening.  d_diffpid
# is measured on TRAINING batches and it climbs the whole way -- 1.665 at 60,
# 2.05 at 90, 2.59 at 120 -- while test mAP falls.  Identity keeps separating
# on data the model has seen and stops generalising.  That is memorisation, and
# it puts the peak at 60 or below.
#
# WHY THE MID-RUN EVALUATIONS DO NOT ANSWER THIS ALREADY.  whu_ce_mod_g2 was
# evaluated every 10 epochs and read 10.98 at epoch 40 of its own run.  That is
# not this experiment.  The schedule is cosine over MAX_EPOCHS, so at epoch 40
# of a 60-epoch run the learning rate is still high and the weights are
# mid-flight; a 40-epoch schedule anneals to zero by then.  A short run
# properly annealed can beat the same epoch of a long run by a lot, which is
# exactly why this needs its own launch rather than a reading off the old log.
#
# COST: about 1.7 hours.
#
# THE SWEEP SO FAR (training-log numbers, final epoch of each run):
#
#     epochs        40?     50?    60   11.58    90   11.26   120   10.05
#     triplet  1.0 11.58   2.0 11.74   3.0 11.70   4.0 11.58
#     erasing  0.5 11.58   0.7 11.60   (null)
#
#     whu_recipe_hihr, the unsplit control:  10.23 / 26.68
#
MODEL:
  PRETRAIN_CHOICE: 'self'
  # Overridden on the command line by run_hihr.sh; this is only the default.
  PRETRAIN_PATH: './out_hihr_cargo_base/transformer_60.pth'
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # [RECIPE] HiHR section 4.4: "cross-entropy loss and triplet loss".
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]
  CE_SPLIT_VIEW: False
  CE_SPLIT_MODALITY: True
  # [VARIABLE] the only deliberate change from hihr_whu_ce_mod.yml.
  CE_MODALITY_GROUPS: [0, 0, 1]

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  # 4.2: "using Adam"
  OPTIMIZER_NAME: 'Adam'
  # 4.2: "We train for 60 epochs"
  MAX_EPOCHS: 50
  # 4.2: "3.5e-4 for randomly initialized modules and 5e-6 for pre-trained
  #       components"  -- BASE_LR is the head, PRETRAINED_LR the CLIP tower.
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # 4.2: "A warm-up strategy with 100 iterations is applied before the cosine
  #       learning rate schedule."
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 50
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_50.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/whu_ce_mod_g2_e50'
