# HiHR baseline, reproduced on CARGO (the paper's own ablation dataset).
#
#   Yang & Zhang, "HiHR: Hierarchical Hyperbolic Representation for
#   Aerial-Ground Person Re-Identification", ECCV 2026 (arXiv:2607.09186v1).
#
# Section 4.4 defines the baseline as: "the cross-entropy loss and triplet loss
# to train the baseline model, which is based on the ViT-B/16 from CLIP".
# Everything else comes from section 4.2, quoted per line below.
#
# What the paper does NOT state, and where our value comes from:
#   * weight decay          -- not given; kept at the repo's 1e-4
#   * cosine floor          -- not given; 0.002 of each group's peak (repo default)
#   * label smoothing       -- not mentioned, so plain cross-entropy (off)
#   * padding before crop   -- "random cropping" only; kept at the repo's 10
# These four are the honest gaps in the reproduction. Everything else is pinned.

MODEL:
  PRETRAIN_CHOICE: 'imagenet'      # "load a pretrained file", not ImageNet-specific
  PRETRAIN_PATH: 'ViT-B-16.pt'     # sha256 5806e77c... official OpenAI release
  # 4.2: "We adopt the CLIP-ViT-B/16 as the visual and text encoder."
  TRANSFORMER_TYPE: 'vit_base_clip'
  # 4.4: "cross-entropy loss and triplet loss"
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  STRIDE_SIZE: [16, 16]

INPUT:
  # 4.2: "images are resized to 256 x 128 x 3"
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # 4.2: "random horizontal flipping, random cropping and random erasing"
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  # CLIP's own normalisation -- the tower was fitted to these statistics.
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('CARGO')
  ROOT_DIR: ('/data')
  # CARGO is single-modality; this is a placeholder key, not a folder name.
  MODALITIES: ['RGB']
  # Table 4 reports the baseline under ALL.  AA / GG / AG are the other three.
  PROTOCOL: 'ALL'

DATALOADER:
  SAMPLER: 'PKM'
  # 4.2: "with 4 images sampled per identity"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  # 4.2: "using Adam"
  OPTIMIZER_NAME: 'Adam'
  # 4.2: "We train for 60 epochs"
  MAX_EPOCHS: 60
  # 4.2: "3.5e-4 for randomly initialized modules and 5e-6 for pre-trained
  #       components"  -- BASE_LR is the head, PRETRAINED_LR the CLIP tower.
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  # 4.2: "a batch size of 64"
  IMS_PER_BATCH: 64
  # 4.2: "A warm-up strategy with 100 iterations is applied before the cosine
  #       learning rate schedule."
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  # Plain CE + triplet, no ProCA/GPD: that is what "baseline" means in table 4.
  LOSS_TYPE: "base"

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_60.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  # fast-reid scores CARGO with the Market-1501 junk rule.  The repo default,
  # 'sysu', drops the query's whole camera and reads several points higher --
  # it would not match any number in the paper.
  METRIC: 'market'

OUTPUT_DIR: './logs/hihr_cargo_base'
